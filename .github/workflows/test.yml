name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./internal/... -count=1 -timeout 120s

      # CGO off is a product requirement, not an optimization: the release
      # binaries are static and the serial enumerator must not quietly require
      # a C toolchain on one platform. Set as a step env rather than a command
      # prefix, because the Windows runner's pwsh rejects VAR=value command
      # syntax.
      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Test pure-API build
        run: |
          go build -tags no_webui ./...
          go test -tags no_webui -count=1 -run TestNoWebUIBuildCarriesDocsOnly ./internal/webui/
